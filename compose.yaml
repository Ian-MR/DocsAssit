services:
  docsassist:
    build:
      context: .
      dockerfile: Dockerfile

    image: docsassist
    depends_on:
      embedder:
        condition: service_healthy

    volumes:
      - ./src:/app/src
      - ./storage:/app/storage
      - ./indexes:/app/indexes
      - ./manifests:/app/manifests
      - ./docs:/app/docs
      - ./raws:/app/raws
      - ./normalizeds:/app/normalizeds
      - ./chunks:/app/chunks
      - ./databases:/app/databases
      - ./prompts:/app/prompts

    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      LLM_BASE_URL: "http://host.docker.internal:8080"  
      
  embedder:
    image: docsassist

    volumes:
      - ./src:/app/src

    entrypoint:
      - python
      - -m
      - uvicorn
      - src.embedding_service:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"

    ports:
      - "8001:8001"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/docs', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
