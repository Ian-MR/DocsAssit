services:
  docsassist:
    build:
      context: .
      dockerfile: Dockerfile

    image: docsassist

    volumes:
      - ./src:/app/src
      - ./storage:/app/storage
      - ./indexes:/app/indexes
      - ./manifests:/app/manifests
      - ./docs:/app/docs
      - ./raws:/app/raws
      - ./normalizeds:/app/normalizeds
      - ./chunks:/app/chunks
      - ./databases:/app/databases
  embedder:
    image: docsassist

    volumes:
      - ./src:/app/src

    entrypoint:
      - python
      - -m
      - uvicorn
      - src.embedding_service:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
